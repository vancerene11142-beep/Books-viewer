<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Books Viewer</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#12161a;--mute:#66707a;--line:#e3e8e6;--acc:#0f766e;--acc2:#0b5d56;--accsoft:#e3f3f1;--out:#c0392b;--in:#1b8a4b;--warn:#a15c00;--warnbg:#fff4de;--shadow:0 1px 2px rgba(16,24,20,.06),0 6px 18px rgba(16,24,20,.05)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1211;--card:#161d1c;--ink:#eaf1ef;--mute:#92a09c;--line:#243230;--acc:#2bb3a6;--acc2:#6fd6cb;--accsoft:#14312e;--out:#ff7b6b;--in:#52d68a;--warn:#ffb74d;--warnbg:#33260d;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:var(--ink)}
.n{font-variant-numeric:tabular-nums}
#top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
#top .t{flex:1;min-width:0}
#ttl{font-weight:750;font-size:19px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{color:var(--mute);font-size:12.5px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.pill svg{width:15px;height:15px}
main{padding:4px 16px 16px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700}
.hero{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border:0}
.hero h3{color:rgba(255,255,255,.78)}
.hero .big{font-size:34px;font-weight:780;letter-spacing:-.5px}
.hero .sm{opacity:.85;font-size:13px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
.grid2 .card{margin:0}
.big{font-size:22px;font-weight:740;letter-spacing:-.3px}
.mute{color:var(--mute)}.sm{font-size:13px}
.oo{color:var(--out)}.ii{color:var(--in)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row[data-a]{cursor:pointer}
.row .l{flex:1;min-width:0}
.row .l b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .l>span{font-size:12.5px;color:var(--mute);display:block;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;white-space:nowrap}
.row .r b{display:block;font-weight:700}
.row .r>span{font-size:12px;color:var(--mute)}
.chev{width:16px;height:16px;color:var(--mute);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--acc);color:#fff;padding:14px;font-weight:700;font-size:16px;text-align:center}
.btn.sec{background:var(--accsoft);color:var(--acc2)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45}
.srch{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;font-size:16px;margin:0 0 10px}
.srch:focus,input:focus{outline:2px solid var(--acc);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px}
.flag{border-radius:12px;padding:10px 12px;font-size:13.5px;margin:0 0 10px}
.flag.ok{background:var(--accsoft);color:var(--acc2)}
.flag.warn{background:var(--warnbg);color:var(--warn)}
.flag.bad{background:#fde8e6;color:#a4281c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .flag.bad{background:#3a1713;color:#ff9d90}}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--accsoft);color:var(--acc2);letter-spacing:.03em;vertical-align:middle}
.tag.w{background:var(--warnbg);color:var(--warn)}
.ledger .tr{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ledger .tr:first-child{border-top:0}
.ledger .d{width:78px;flex:none;color:var(--mute);font-size:12px;padding-top:2px;white-space:nowrap}
.ledger .m{flex:1;min-width:0;overflow-wrap:anywhere}
.ledger .a{text-align:right;white-space:nowrap}
.ledger .a b{display:block}
.ledger .a>span{font-size:12px;color:var(--mute)}
.ledger .open{background:var(--accsoft);margin:0 -16px;padding:10px 16px;border-radius:0}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv.tot{font-weight:750}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
#tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:650;color:var(--mute);padding:6px 0;border-radius:12px}
#tabs button svg{width:23px;height:23px}
#tabs button.on{color:var(--acc)}
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .22s ease;visibility:hidden}
#sheet.open{transform:none;visibility:visible}
#sheetTop{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;z-index:2}
#sheetTop .back{border:0;background:var(--card);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
#sheetTop .back svg{width:20px;height:20px}
#sheetTitle{font-weight:750;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheetBody{padding:4px 16px 40px;max-width:720px;margin:0 auto}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#12161a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:40;max-width:90%;text-align:center}
.empty{text-align:center;padding:40px 12px}
.empty .ic{width:68px;height:68px;border-radius:20px;background:var(--accsoft);color:var(--acc);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.empty .ic svg{width:34px;height:34px}
.empty h2{margin:0 0 6px;font-size:21px}
.steps{text-align:left;margin:14px auto;max-width:360px;padding-left:20px;color:var(--mute);font-size:14.5px}
.steps li{margin:6px 0}
input[type=file]{display:none}
.hint{font-size:12.5px;color:var(--mute);margin:6px 0 12px}

.u{font-size:11px;font-weight:700;margin-left:4px;letter-spacing:.04em;opacity:.85}
.grid2 .big{font-size:19px}.grid2 .card{min-width:0;padding:14px}
.row .r>span.oo{color:var(--out);font-size:15px;font-weight:700}.row .r>span.ii{color:var(--in);font-size:15px;font-weight:700}
</style></head><body>
<header id="top"><div class="t"><div id="ttl">Books</div><div id="sub"></div></div>
<button class="pill" id="bkBtn" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Months</button></header>
<main id="main"></main>
<nav id="tabs">
<button data-t="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
<button data-t="acc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18.5 14.8c1.7.7 2.8 2.3 3 4.6"/></svg>Accounts</button>
<button data-t="days"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>Days</button>
<button data-t="find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Search</button>
<button data-t="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</button>
</nav>
<div id="sheet"><div id="sheetTop"><button class="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><div id="sheetTitle"></div></div><div id="sheetBody"></div></div>
<input type="file" id="file" accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
<div id="toast"></div>
<script>
(function(){
/* ===== shared with the Cash Entry app (same maths, copied unchanged) ===== */
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var TYPES=['Customer','Correspondent','Internal','Expense'];
var L=null,CACHE=null,dbH=null,dbTried=false,ARCH_END='';
var S={open:'',entries:[],exp:[],deals:[],date:''};function rows(){return[]}
var codes=[],BIZ=ls('viewer.biz')||'';
function tbIncl(){return false}function pendCount(){return 0}
function ls(k,v){try{if(v===undefined){var s=localStorage.getItem(k);return s?JSON.parse(s):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function r2(x){var g=x<0?-1:1;x=Math.abs(x);return(g*Math.round(parseFloat((x*100).toPrecision(15)))/100)+0}
function num(v){if(v===''||v==null)return 0;var n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?0:r2(n)}
function fmt(n){n=r2(n);return n.toLocaleString('en-IN',{minimumFractionDigits:(n%1?2:0),maximumFractionDigits:2})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function z2(x){return(x<10?'0':'')+x}
function ymd(d){return d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate())}
function today(){var d=new Date();function p(n){return(n<10?'0':'')+n}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function addDay(s,n){var p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]+n);function q(x){return(x<10?'0':'')+x}return d.getFullYear()+'-'+q(d.getMonth()+1)+'-'+q(d.getDate())}
function fd(s){if(!s)return'';var p=String(s).split('-');return p.length===3?(p[2]+'-'+MON[+p[1]-1]+'-'+p[0]):s}
function fmt2(n){return r2(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function dealInr(v,op,r){return r2(op==='/'?v/r:v*r)}
function dealNarr(x){return x.v+' '+x.op+' '+x.r+' ('+x.ps+')'}
function signed(n){return n<0?'-'+fmt2(-n):fmt2(n)}
function normType(t){t=String(t||'').trim().toLowerCase();for(var i=0;i<TYPES.length;i++)if(TYPES[i].toLowerCase()===t)return TYPES[i];return''}
function typeOf(c){return(L&&L.types&&L.types[c])||''}
function lastDayOf(m){var p=m.split('-'),d=new Date(+p[0],+p[1],0);return m+'-'+z2(d.getDate())}
function newLedger(){return{v:1,types:{},reserve:'RESERVE',crown:{code:'CROWN',open:0},ob:null,days:[],late:[],wait:[],commCode:'COMM',seq:1,chg:0,bak:0}}
function fixLedger(x){x=x||newLedger();x.days=x.days||[];x.late=x.late||[];x.wait=x.wait||[];x.seq=x.seq||1;x.commCode=x.commCode==null?'COMM':x.commCode;x.crown=x.crown||{code:'CROWN',open:0};x.types=x.types||{};x.reserve=x.reserve||'RESERVE';x.chg=x.chg||0;x.bak=x.bak||0;x.ob=x.ob||null;return x}
function lateS(e){return e.os!=null?e.os:1e9+e.s}
function waitS(w){var n=parseInt(String(w.id).slice(1),10);return isNaN(n)?2e9:n}
function events(){
  if(CACHE)return CACHE;
  var ev=[],ob=L.ob?L.ob.date:'';
  L.days.forEach(function(d){
    if(ob&&d.date<ob)return;
    if(ARCH_END&&d.date>=ARCH_END)return;
    (d.deals||[]).forEach(function(x){ev.push({d:d.date,k:0,s:x.s,c:x.c,n:dealNarr(x),o:x.ps==='S'?x.inr:0,i:x.ps==='P'?x.inr:0,cr:0,ci:0})});
    (d.ent||[]).forEach(function(e){ev.push({d:d.date,k:1,s:e.s,c:e.c,n:e.n,o:e.o,i:e.i,cr:e.cr,ci:e.ci})});
  });
  L.late.forEach(function(e){if(ob&&e.d<ob)return;if(ARCH_END&&e.d>=ARCH_END)return;ev.push({d:e.d,k:1,s:lateS(e),c:e.c,n:e.n,o:e.o,i:e.i,cr:e.cr,ci:e.ci})});
  return(CACHE=ev);
}
function balances(to,incl){
  var net={},cm=0,cc=L.commCode;
  if(L.ob)Object.keys(L.ob.rows).forEach(function(c){var r=L.ob.rows[c];net[c]=(r[1]||0)-(r[0]||0)});
  (incl?events().concat(pendingEv()):events()).forEach(function(e){if(to&&e.d>to)return;var v=e.i-e.o;if(e.c!==cc)v+=e.ci-e.cr;net[e.c]=(net[e.c]||0)+v;cm+=e.cr-e.ci});
  if(cc&&Math.abs(cm)>0.0001)net[cc]=(net[cc]||0)+cm;
  Object.keys(net).forEach(function(k){net[k]=r2(net[k])});
  return net;
}
function pendingEv(){
  var ev=[],d=S.date||today();
  (S.deals||[]).forEach(function(x,ix){ev.push({d:d,k:0,s:2e9+ix,c:x.code,n:dealNarr({v:x.vol,op:x.op,r:x.rate,ps:x.ps}),o:x.ps==='S'?x.inr:0,i:x.ps==='P'?x.inr:0,cr:0,ci:0,p:1})});
  rows().forEach(function(e,ix){if(e.code)ev.push({d:d,k:1,s:2e9+ix,c:e.code,n:e.narr,o:e.out||0,i:e.inn||0,cr:e.cr||0,ci:e.ci||0,p:1})});
  return ev;
}
function archFor(from){
  if(!L||!L.ob||!L.obHist||!L.obHist.length||!from||from>=L.ob.date)return null;
  var best=null;L.obHist.forEach(function(h){if(h.date<=from&&(!best||h.date>best.date))best=h});return best;
}
function statement(code,from,to,incl){
  if(!ARCH_END){
    var A=archFor(from);
    if(A){
      var cur=L.ob,end=cur.date,t2=(!to||to>=end)?addDay(end,-1):to,res;
      L.ob=A;ARCH_END=end;CACHE=null;
      try{res=statement(code,from,t2,false)}finally{L.ob=cur;ARCH_END='';CACHE=null}
      return res;
    }
  }
  var cc=L.commCode,list=[],ob=0,obr=null,cm=0,npend=0;
  if(L.ob&&L.ob.rows[code]){obr=L.ob.rows[code];ob=(obr[1]||0)-(obr[0]||0)}
  var evs=events();if(incl&&(!to||to>=(S.date||today())))evs=evs.concat(pendingEv());
  evs.forEach(function(e){
    cm+=e.cr-e.ci;
    if(e.c!==code)return;
    if(e.p)npend++;
    if(e.o||e.i||e.n||(!e.cr&&!e.ci))list.push({d:e.d,k:e.k,s:e.s,u:0,n:e.n,o:e.o,i:e.i,p:e.p});
    if((e.cr||e.ci)&&code!==cc)list.push({d:e.d,k:e.k,s:e.s,u:1,n:'Commission',o:e.cr,i:e.ci,p:e.p});
  });
  list.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:a.k-b.k||a.s-b.s||a.u-b.u});
  if(code===cc&&Math.abs(cm)>0.0001)list.push({d:'9999',k:9,s:0,u:0,n:'Commission earned (all accounts)',o:cm<0?-cm:0,i:cm>0?cm:0,tail:true});
  var bal=ob;list.forEach(function(r){bal=r2(bal+r.i-r.o);r.b=bal});
  var open=ob,showOb=true,odate=L.ob?L.ob.date:'';
  if(from&&!(L.ob&&from<=L.ob.date)){
    showOb=false;odate=from;
    var before=list.filter(function(r){return !r.tail&&r.d<from});
    if(before.length)open=before[before.length-1].b;
  }
  var td=today();
  var rows=list.filter(function(r){return r.tail?(!to||to>=td):((!from||r.d>=from)&&(!to||r.d<=to))});
  return{open:open,obr:showOb?obr:null,odate:odate,rows:rows,bal:rows.length?rows[rows.length-1].b:open,npend:rows.filter(function(r){return r.p}).length};
}
function crownRows(){
  var cr=L.crown||{code:'CROWN',open:0},ob=L.ob?L.ob.date:'',pos=num(cr.open),rows=[],open=pos;
  sortedDays().forEach(function(d){
    if(ob&&d.date<ob)return;
    (d.deals||[]).slice().sort(function(a,b){return a.s-b.s}).forEach(function(x){if(x.c!==cr.code)return;var v=x.ps==='P'?x.v:-x.v;pos=r2(pos+v);rows.push({d:d.date,ps:x.ps,vol:x.v,rate:x.r,op:x.op,v:v,pos:pos})});
  });
  (S.deals||[]).forEach(function(x){if(x.code!==cr.code)return;var v=x.ps==='P'?x.vol:-x.vol;pos=r2(pos+v);rows.push({d:S.date||today(),ps:x.ps,vol:x.vol,rate:x.rate,op:x.op,v:v,pos:pos,p:1})});
  return{open:open,rows:rows,pos:pos};
}
function crownPos(extra){
  var cr=L.crown||{code:'CROWN',open:0},ob=L.ob?L.ob.date:'',p=0,sl=0,n=0;
  L.days.forEach(function(d){if(ob&&d.date<ob)return;(d.deals||[]).forEach(function(x){if(x.c===cr.code){n++;if(x.ps==='P')p+=x.v;else sl+=x.v}})});
  (extra||[]).forEach(function(x){if(x.code===cr.code){n++;if(x.ps==='P')p+=x.vol;else sl+=x.vol}});
  return{open:num(cr.open),p:r2(p),s:r2(sl),net:r2(num(cr.open)+p-sl),n:n,code:cr.code};
}
function dealTxt(r){return r.ps+' '+fmt2(r.vol)+' '+(r.op==='/'?'÷':'×')+' '+r.rate}
function monthSummary(m){
  var pre=m?m+'-':'',end=m?m+'-31':'9999-12-31',dp=0,cm=0,ex=0;
  events().forEach(function(e){
    if(m&&e.d.slice(0,8)!==pre)return;
    if(e.k===0){dp+=e.o-e.i;if(L.commCode&&e.c===L.commCode)cm+=e.i-e.o;if(typeOf(e.c)==='Expense')ex+=e.o-e.i}   // a deal booked on COMMISSION or an Expense account: its INR also counts as commission / expense, so the books still tally
    else{cm+=e.cr-e.ci;if(L.commCode&&e.c===L.commCode)cm+=e.i-e.o;if(typeOf(e.c)==='Expense')ex+=e.o-e.i}
  });
  L.wait.forEach(function(w){if(!m||String(w.d).slice(0,8)===pre)cm+=(w.cr||0)-(w.ci||0)});

function listKeys(){

  var q=f.acQ.trim().toUpperCase();if(q)keys=keys.filter(function(k){return k.indexOf(q)>=0});
  keys.sort(f.big?function(a,b){return Math.abs(net[b]||0)-Math.abs(net[a]||0)||(a<b?-1:1)}:function(a,b){return a<b?-1:a>b?1:0});

function findRun(q){
  q=q.trim();var out=$('fOut');if(!out)return;
  if(!q){out.innerHTML='<div class="hint">Search every cash entry and deal in this month.</div>';return}
  var uq=q.toUpperCase(),nq=q.replace(/[, ]/g,''),isNum=/^[\d.]+$/.test(nq),res=[];
  events().forEach(function(e){
    var hit=String(e.c||'').toUpperCase().indexOf(uq)>=0||String(e.n||'').toUpperCase().indexOf(uq)>=0;
    if(!hit&&isNum){[e.o,e.i,e.cr,e.ci].forEach(function(x){if(x&&String(r2(x)).indexOf(nq)>=0)hit=true})}
    if(hit)res.push(e);
  });
  L.wait.forEach(function(w){
    var hit=String(w.n||'').toUpperCase().indexOf(uq)>=0;if(!hit&&isNum)[w.o,w.i].forEach(function(x){if(x&&String(r2(x)).indexOf(nq)>=0)hit=true});
    if(hit)res.push({d:w.d,c:'',n:w.n,o:w.o,i:w.i,cr:w.cr,ci:w.ci,k:1,wt:1});
  });
  res.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0});
  var h='<div class="hint">'+res.length+' result'+(res.length===1?'':'s')+(res.length>100?' (showing the latest 100)':'')+'</div><div class="card" style="padding:4px 16px">';
  res.slice(0,100).forEach(function(e){
    var a=e.o?'<b class="oo n">'+fmt2(e.o)+'</b><span>OUT</span>':e.i?'<b class="ii n">'+fmt2(e.i)+'</b><span>IN</span>':(e.cr||e.ci)?'<b class="n">'+fmt2(e.cr||e.ci)+'</b><span>commission</span>':'';
    h+='<div class="row"'+(e.c?' data-a="stmt" data-v="'+esc(e.c)+'"':'')+'><div class="l"><b>'+esc(e.c||'(no code yet)')+'</b><span>'+fd(e.d)+' · '+esc(e.n||'')+(e.k===0?' <span class="tag">DEAL</span>':'')+'</span></div><div class="r">'+a+'</div>'+(e.c?IC.chev:'')+'</div>';
  });
  out.innerHTML=h+'</div>';
}

  h+='<div class="card">'+C.res.map(function(x){return'<div class="kv"><span>'+esc(x.l)+'</span><span class="n">'+(x.ok===false?'<b class="oo">✗ '+esc(x.t)+' (Excel '+esc(x.e)+')</b>':x.ok===null?'–':'✓ '+esc(x.t||x.e))+'</span></div>'}).join('')+'</div>';
  if(C.diff.length)h+='<div class="card"><h3>Accounts that differ</h3>'+C.diff.slice(0,40).map(function(d){return'<div class="kv"><span>'+esc(d.c)+'</span><span class="n sm">Excel '+fmt2(d.eo)+'/'+fmt2(d.ei)+' · here '+fmt2(d.to)+'/'+fmt2(d.ti)+'</span></div>'}).join('')+'</div>';
  h+='<div class="hint">This compares the workbook\'s own totals with figures the viewer works out again from every entry.</div>';
  return{t:'Check against Excel',h:h};
 },
 books:function(){
  var h='<div class="card" style="padding:4px 16px">'+BOOKS.slice().sort(function(a,b){return a.id<b.id?1:-1}).map(function(b){
    return'<div class="row"><div class="l" data-a="openbook" data-v="'+b.id+'" style="cursor:pointer"><b>'+bookLabel(b.id)+(CUR&&CUR.id===b.id?' <span class="tag">OPEN</span>':'')+'</b><span>'+b.days+' days · up to '+fd(b.to)+' · imported '+new Date(b.at).toLocaleDateString('en-GB')+'</span></div><button class="chip" data-a="delbook" data-v="'+b.id+'" style="color:var(--out)">'+(f.del===b.id?'Sure?':'Remove')+'</button></div>'}).join('')+(BOOKS.length?'':'<div class="mute" style="padding:12px 0">Nothing yet.</div>')+'</div>';
  h+='<button class="btn" data-a="import">Import a workbook</button><div class="hint">Importing the same month again replaces it with the newer copy. Each month is a separate book, like your Excel files.</div>';
  return{t:'Months on this phone',h:h};
 },
 settings:function(){
  var h='<div class="card"><h3>Business name (shown on pictures)</h3><input class="srch" id="bizIn" value="'+esc(BIZ)+'" placeholder="e.g. Your shop name" style="margin:0"><button class="btn sec" data-a="saveBiz" style="margin-top:10px">Save name</button></div>';
  h+='<div class="card"><h3>Install on this phone</h3><div class="mute sm" style="margin-bottom:8px">Install it so it opens like an app, even with no internet.</div>'+(deferredInstall?'<button class="btn" data-a="install">Install app</button>':'<div class="mute sm">In Chrome: ⋮ menu → <b>Add to Home screen</b> / <b>Install app</b>.</div>')+'</div>';
  h+='<div class="card"><h3>Privacy</h3><div class="mute sm">This viewer reads the workbook inside your phone\'s browser. The data is stored only on this phone and is never sent anywhere. Only the pictures you choose to send leave the phone.</div></div>';
  return{t:'Settings',h:h};
 }
};
var deferredInstall=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e});

/* ---------- import ---------- */
var PEND=null;
function chooseFile(){$('file').value='';$('file').click()}
$('file').onchange=function(){
  var fl=this.files&&this.files[0];if(!fl)return;
  sub2('Reading…','<div class="empty"><div class="mute">Reading '+esc(fl.name)+'…</div></div>');
  var fr=new FileReader();
  fr.onerror=function(){sub2('Import','<div class="flag bad">Could not read that file.</div>')};
  fr.onload=function(){
    readXlsx(new Uint8Array(fr.result)).then(function(sh){
      var b=buildFromSheets(sh),keep=L;
      var C=xlCompare(b),bad=C.res.filter(function(x){return x.ok===false}).length+C.diff.length;
      L=keep;CACHE=null;
      PEND={b:b,C:C,bad:bad,name:fl.name};
      showPreview();
    }).catch(function(e){sub2('Import','<div class="flag bad"><b>That did not work.</b> '+esc(e&&e.message||e)+'<br>Pick the monthly master workbook (.xlsx).</div>')});
  };
  fr.readAsArrayBuffer(fl);
};
function sub2(t,h){CURSUB=null;openSub(t,h,'imp')}
function showPreview(){
  var P=PEND,b=P.b,st=b.stats,id=(b.L.ob&&b.L.ob.date||'').slice(0,7),ex=BOOKS.filter(function(x){return x.id===id})[0];
  var h='<div class="card"><h3>'+bookLabel(id)+'</h3><div class="kv"><span>Accounts</span><b>'+st.coa+'</b></div><div class="kv"><span>Days entered</span><b>'+st.days+'</b></div><div class="kv"><span>Cash entries</span><b>'+st.cash+'</b></div><div class="kv"><span>Currency deals</span><b>'+st.deals+'</b></div><div class="kv"><span>Covers</span><b>'+fd(st.from)+' → '+fd(st.to)+'</b></div><div class="kv tot"><span>Closing cash</span><span class="n">'+fmt2(st.lastClose)+'</span></div></div>';
  h+='<div class="flag '+(P.bad?'bad':'ok')+'">'+(P.bad?'<b>'+P.bad+' difference(s) from the workbook\'s own summary.</b> You can still save it; check "Check against Excel" afterwards.':'✓ Matches the workbook: '+P.C.same+' accounts and all summary figures.')+'</div>';
  if(st.wait)h+='<div class="flag warn">'+st.wait+' entries have no account code yet.</div>';
  if(b.warn.length)h+='<div class="flag warn">'+b.warn.slice(0,4).map(esc).join('<br>')+(b.warn.length>4?'<br>…':'')+'</div>';
  if(ex)h+='<div class="flag warn">This replaces the copy of '+bookLabel(id)+' imported on '+new Date(ex.at).toLocaleDateString('en-GB')+'.</div>';
  h+='<button class="btn" data-a="savebook">Save to this phone</button>';
  $('sheetTitle').textContent='Import';$('sheetBody').innerHTML=h;
}
function saveBook(){
  var P=PEND;if(!P)return;var b=P.b,id=(b.L.ob&&b.L.ob.date||'').slice(0,7),st=b.stats;
  if(!id){toast('Could not work out the month of this workbook');return}
  kvSet('book:'+id,{L:b.L,X:b.X},function(ok){
    if(!ok){toast('Not enough space to save');return}
    BOOKS=BOOKS.filter(function(x){return x.id!==id});
    BOOKS.push({id:id,at:Date.now(),from:st.from,to:st.to,days:st.days,deals:st.deals,cash:st.cash,file:P.name,bad:P.bad});
    saveIndex(function(){PEND=null;openBook(id,function(){closeAll();try{if(history.state&&history.state.s)history.back()}catch(e){}TAB='home';render();toast(bookLabel(id)+' saved')})});
  });
}

/* ---------- events ---------- */
function act(a,v){
  if(a==='import'){chooseFile();return}
  if(a==='stmt')return sub('stmt',v);
  if(a==='day')return sub('day',v);
  if(a==='crown')return sub('crown');
  if(a==='tb')return sub('tb');
  if(a==='month')return sub('month');
  if(a==='verify')return sub('verify');
  if(a==='books')return sub('books');
  if(a==='settings')return sub('settings');
  if(a==='ty'){f.ty=v;$('main').innerHTML=accHtml();return}
  if(a==='tbty'){f.ty=v;resub();return}
  if(a==='srt'){f.big=v==='big';$('main').innerHTML=accHtml();return}
  if(a==='hz'){f.hz=!f.hz;$('main').innerHTML=accHtml();return}
  if(a==='per'){f.per=v;resub();return}
  if(a==='cwper'){f.cwPer=v;resub();return}
  if(a==='sendStmt')return sendStatement();
  if(a==='sendCrown')return shareImages(crownCanvases(),'crown-aed-'+bookEnd(),'Crown AED statement','Crown AED statement');
  if(a==='sendTb')return shareImages(tbCanvases(),'trial-balance-'+bookEnd(),'Trial balance','Trial balance');
  if(a==='sendDay'){var d=null;L.days.forEach(function(x){if(x.id===v)d=x});if(d)shareImages(dayCanvases(dayModelPosted(d)),'cash-book-'+d.date,'Cash book '+fd(d.date),'Cash book');return}
  if(a==='savebook')return saveBook();
  if(a==='openbook'){openBook(v,function(ok){if(ok){closeAll();try{if(history.state&&history.state.s)history.back()}catch(e){}TAB='home';render();toast(bookLabel(v)+' opened')}});return}
  if(a==='delbook'){
    if(f.del!==v){f.del=v;resub();clearTimeout(f.delT);f.delT=setTimeout(function(){f.del=null;resub()},3500);return}
    f.del=null;BOOKS=BOOKS.filter(function(x){return x.id!==v});kvDel('book:'+v,function(){});
    saveIndex(function(){
      if(CUR&&CUR.id===v){var n=BOOKS.slice().sort(function(a,b){return a.id<b.id?1:-1})[0];if(n){openBook(n.id,function(){resub();render()})}else{L=null;B=null;CUR=null;ls('viewer.active','');closeAll();render()}}
      else resub();
    });return;
  }
  if(a==='saveBiz'){BIZ=($('bizIn').value||'').trim();ls('viewer.biz',BIZ);document.title=BIZ||'Books Viewer';render();toast('Saved');return}
  if(a==='install'&&deferredInstall){deferredInstall.prompt();deferredInstall=null;return}
}
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-a]');if(t){act(t.getAttribute('data-a'),t.getAttribute('data-v'));return}
  var tb=e.target.closest&&e.target.closest('#tabs button');if(tb){setTab(tb.getAttribute('data-t'));return}
  if(e.target.closest&&e.target.closest('#bkBtn')){sub('books');return}
  if(e.target.closest&&e.target.closest('.back')){goBack();return}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='acQ'){f.acQ=t.value;$('accList').innerHTML=accRows()}
  else if(t.id==='fq'){f.sq=t.value;findRun(t.value)}
});
document.addEventListener('change',function(e){var t=e.target;if(t.id==='pf'){f.pf=t.value;resub()}else if(t.id==='pt'){f.pt=t.value;resub()}});

/* ---------- start ---------- */
document.title=bizName();
loadIndex(function(){
  var id=ls('viewer.active');
  if(!id||!BOOKS.some(function(b){return b.id===id})){var n=BOOKS.slice().sort(function(a,b){return a.id<b.id?1:-1})[0];id=n&&n.id}
  if(id)openBook(id,function(){render()});else render();
});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){});

})();
</script></body></html>
